<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JARVIS</title>
<style>
  :root {
    --glow: #35e0f0;
    --glow-dim: #1a7f8a;
    --bg: #0a1420;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: radial-gradient(circle at center, #12212f 0%, var(--bg) 70%);
    height: 100vh;
    font-family: "SF Mono", Menlo, monospace;
    color: var(--glow);
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr 460px 1fr;
    grid-template-rows: 1fr auto;
    align-items: center;
    gap: 20px;
    padding: 30px;
  }

  /* --- Reactor --- */
  .reactor {
    position: relative;
    width: 420px;
    height: 420px;
    grid-column: 2;
    grid-row: 1;
    justify-self: center;
  }

  .reactor svg {
    position: absolute;
    inset: 0;
    filter: drop-shadow(0 0 6px var(--glow-dim));
  }

  /* Each ring spins at its own speed/direction so the whole thing
     never looks like one rigid object rotating. */
  .spin-slow    { animation: spin 24s linear infinite; }
  .spin-medium  { animation: spin 14s linear infinite reverse; }
  .spin-fast    { animation: spin 8s  linear infinite; }
  .spin-slowest { animation: spin 40s linear infinite reverse; }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .core {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
  }

  .label {
    font-size: 22px;
    letter-spacing: 8px;
    text-shadow: 0 0 12px var(--glow);
  }

  .status {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--glow-dim);
    text-transform: uppercase;
    text-align: center;
    max-width: 220px;
  }

  .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: center; }

  @keyframes pulse {
    0%, 100% { opacity: 0.45; }
    50%      { opacity: 0.9; }
  }

  /* --- Side panels --- */
  .panel {
    grid-row: 1;
    align-self: center;
    max-height: 70vh;
    display: flex;
    flex-direction: column;
    font-size: 11px;
    line-height: 1.6;
  }

  .panel-conversation { grid-column: 1; }
  .panel-feed { grid-column: 3; }

  .panel-title {
    color: var(--glow);
    letter-spacing: 4px;
    font-size: 10px;
    margin-bottom: 10px;
    opacity: 0.8;
    border-bottom: 1px solid var(--glow-dim);
    padding-bottom: 6px;
    flex-shrink: 0;
  }

  .panel-body {
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--glow-dim) transparent;
  }

  .panel-empty { color: var(--glow-dim); opacity: 0.5; }

  /* --- Conversation --- */
  .turn { margin-bottom: 12px; }

  .turn-role {
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--glow-dim);
    margin-bottom: 3px;
  }

  .turn-text { color: #cfefff; white-space: pre-wrap; }
  .turn.jarvis .turn-text { color: var(--glow); }
  .turn.system .turn-text { color: #ffd166; }

  /* --- Tool activity --- */
  .event {
    display: flex;
    gap: 8px;
    padding: 3px 0;
    opacity: 0.85;
    border-left: 2px solid transparent;
    padding-left: 8px;
  }

  /* Colour-coded by outcome so permission decisions are visible at a glance */
  .event.allowed { border-left-color: var(--glow); }
  .event.denied  { border-left-color: #ff6b6b; }
  .event.dry-run { border-left-color: #ffd166; }
  .event.error   { border-left-color: #ff6b6b; }

  .event-time { color: var(--glow-dim); flex-shrink: 0; }
  .event-tool { color: var(--glow); flex-shrink: 0; }
  .event-args {
    color: var(--glow-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* --- Input bar --- */
  .input-bar {
    grid-column: 2;
    grid-row: 2;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  #input {
    flex: 1;
    background: rgba(53, 224, 240, 0.05);
    border: 1px solid var(--glow-dim);
    border-radius: 22px;
    padding: 12px 20px;
    color: var(--glow);
    font-family: inherit;
    font-size: 13px;
    outline: none;
  }

  #input:focus {
    border-color: var(--glow);
    box-shadow: 0 0 12px rgba(53, 224, 240, 0.25);
  }

  #input::placeholder { color: var(--glow-dim); opacity: 0.7; }
</style>
</head>
<body>

  <div class="panel panel-conversation">
    <div class="panel-title">CONVERSATION</div>
    <div class="panel-body" id="messages">
      <div class="panel-empty">say something</div>
    </div>
  </div>

  <div class="reactor">

    <!-- Outer dashed ring -->
    <svg class="spin-slowest" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="94" fill="none"
              stroke="var(--glow-dim)" stroke-width="0.8"
              stroke-dasharray="2 6"/>
    </svg>

    <!-- Segmented ring: long arcs with gaps -->
    <svg class="spin-slow" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="84" fill="none"
              stroke="var(--glow)" stroke-width="1.5"
              stroke-dasharray="60 30" opacity="0.7"/>
    </svg>

    <!-- Tick marks -->
    <svg class="spin-medium" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="72" fill="none"
              stroke="var(--glow)" stroke-width="4"
              stroke-dasharray="1 5" opacity="0.55"/>
    </svg>

    <!-- Thin bright ring -->
    <svg class="spin-fast" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="60" fill="none"
              stroke="var(--glow)" stroke-width="1"
              stroke-dasharray="120 40"/>
    </svg>

    <!-- Inner dotted ring -->
    <svg class="spin-medium" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="50" fill="none"
              stroke="var(--glow-dim)" stroke-width="3"
              stroke-dasharray="1 4"/>
    </svg>

    <!-- Static core ring + soft filled disc -->
    <svg viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="40" fill="none"
              stroke="var(--glow)" stroke-width="1.5" opacity="0.9"/>
      <circle class="pulse" cx="100" cy="100" r="38"
              fill="var(--glow)" opacity="0.12"/>
    </svg>

    <div class="core">
      <div class="label">JARVIS</div>
      <div class="status" id="status">standby</div>
    </div>

  </div>

  <div class="panel panel-feed">
    <div class="panel-title">TOOL ACTIVITY</div>
    <div class="panel-body" id="events">
      <div class="panel-empty">no activity yet</div>
    </div>
  </div>

  <div class="input-bar">
    <input id="input" type="text" placeholder="Type a message and press Enter…" autocomplete="off">
  </div>

  <script>
    const input = document.getElementById("input");

    // Escape anything coming from the server before putting it in the
    // DOM — screen OCR and model output can contain angle brackets.
    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    async function send(text) {
      await fetch("/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });
    }

    input.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      const text = input.value.trim();
      if (!text) return;
      send(text);
      input.value = "";
    });

    function renderEvents(events) {
      const container = document.getElementById("events");
      if (!events || events.length === 0) {
        container.innerHTML = '<div class="panel-empty">no activity yet</div>';
        return;
      }
      container.innerHTML = events.map(e => `
        <div class="event ${e.outcome}">
          <span class="event-time">${escapeHtml(e.time)}</span>
          <span class="event-tool">${escapeHtml(e.tool)}</span>
          <span class="event-args">${escapeHtml(e.args)}</span>
        </div>
      `).join("");
    }

    let lastMessageCount = 0;

    function renderMessages(messages) {
      const container = document.getElementById("messages");
      if (!messages || messages.length === 0) {
        container.innerHTML = '<div class="panel-empty">say something</div>';
        return;
      }
      container.innerHTML = messages.map(m => `
        <div class="turn ${m.role}">
          <div class="turn-role">${escapeHtml(m.role)}</div>
          <div class="turn-text">${escapeHtml(m.text)}</div>
        </div>
      `).join("");

      // Only auto-scroll when something new arrived, so the user can
      // scroll back through history without being yanked to the bottom.
      if (messages.length !== lastMessageCount) {
        container.scrollTop = container.scrollHeight;
        lastMessageCount = messages.length;
      }
    }

    async function poll() {
      try {
        const res = await fetch("/status");
        const data = await res.json();
        document.getElementById("status").textContent =
          data.detail ? `${data.status} — ${data.detail}` : data.status;
        renderEvents(data.events);
        renderMessages(data.messages);
      } catch (e) {
        document.getElementById("status").textContent = "disconnected";
      }
    }

    setInterval(poll, 300);
    poll();
    input.focus();
  </script>

</body>
</html>

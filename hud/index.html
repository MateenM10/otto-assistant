<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JARVIS</title>
<style>
  :root {
    --glow: #35e0f0;
    --glow-dim: #1a7f8a;
    --bg: #0a1420;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: radial-gradient(circle at center, #12212f 0%, var(--bg) 70%);
    height: 100vh;
    font-family: "SF Mono", Menlo, monospace;
    color: var(--glow);
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr 460px 1fr;
    grid-template-rows: 1fr auto;
    align-items: center;
    gap: 20px;
    padding: 30px;
  }

  .reactor {
    position: relative;
    width: 420px;
    height: 420px;
    grid-column: 2;
    grid-row: 1;
    justify-self: center;
  }

  .reactor svg {
    position: absolute;
    inset: 0;
    filter: drop-shadow(0 0 6px var(--glow-dim));
  }

  /* Each ring spins at its own speed/direction so the whole thing
     never looks like one rigid object rotating. */
  .spin-slow    { animation: spin 24s linear infinite; }
  .spin-medium  { animation: spin 14s linear infinite reverse; }
  .spin-fast    { animation: spin 8s  linear infinite; }
  .spin-slowest { animation: spin 40s linear infinite reverse; }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .core {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
  }

  .label {
    font-size: 22px;
    letter-spacing: 8px;
    text-shadow: 0 0 12px var(--glow);
  }

  .status {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--glow-dim);
    text-transform: uppercase;
    text-align: center;
    max-width: 220px;
  }

  .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: center; }

  @keyframes pulse {
    0%, 100% { opacity: 0.45; }
    50%      { opacity: 0.9; }
  }

  .panel {
    grid-row: 1;
    align-self: center;
    max-height: 70vh;
    display: flex;
    flex-direction: column;
    font-size: 11px;
    line-height: 1.6;
  }

  .panel-conversation { grid-column: 1; }
  .panel-feed { grid-column: 3; }

  .panel-title {
    color: var(--glow);
    letter-spacing: 4px;
    font-size: 10px;
    margin-bottom: 10px;
    opacity: 0.8;
    border-bottom: 1px solid var(--glow-dim);
    padding-bottom: 6px;
    flex-shrink: 0;
  }

  .panel-body {
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--glow-dim) transparent;
  }

  .panel-empty { color: var(--glow-dim); opacity: 0.5; }

  .turn { margin-bottom: 12px; }

  .turn-role {
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--glow-dim);
    margin-bottom: 3px;
  }

  .turn-text { color: #cfefff; white-space: pre-wrap; }
  .turn.jarvis .turn-text { color: var(--glow); }
  .turn.system .turn-text { color: #ffd166; }

  /* Blinking cursor on the reply still being written */
  .turn.streaming .turn-text::after {
    content: "▍";
    animation: blink 1s step-end infinite;
    opacity: 0.8;
  }

  @keyframes blink {
    0%, 100% { opacity: 0.8; }
    50%      { opacity: 0; }
  }

  .event {
    display: flex;
    gap: 8px;
    padding: 3px 0;
    opacity: 0.85;
    border-left: 2px solid transparent;
    padding-left: 8px;
  }

  /* Colour-coded by outcome so permission decisions are visible at a glance */
  .event.allowed { border-left-color: var(--glow); }
  .event.denied  { border-left-color: #ff6b6b; }
  .event.dry-run { border-left-color: #ffd166; }
  .event.error   { border-left-color: #ff6b6b; }

  .event-time { color: var(--glow-dim); flex-shrink: 0; }
  .event-tool { color: var(--glow); flex-shrink: 0; }
  .event-args {
    color: var(--glow-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .input-bar {
    grid-column: 2;
    grid-row: 2;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  #input {
    flex: 1;
    background: rgba(53, 224, 240, 0.05);
    border: 1px solid var(--glow-dim);
    border-radius: 22px;
    padding: 12px 20px;
    color: var(--glow);
    font-family: inherit;
    font-size: 13px;
    outline: none;
  }

  #input:focus {
    border-color: var(--glow);
    box-shadow: 0 0 12px rgba(53, 224, 240, 0.25);
  }

  #input::placeholder { color: var(--glow-dim); opacity: 0.7; }

  #mic, #speech {
    background: rgba(53, 224, 240, 0.05);
    border: 1px solid var(--glow-dim);
    border-radius: 50%;
    width: 44px;
    height: 44px;
    color: var(--glow);
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.2s;
  }

  #mic:hover, #speech:hover { border-color: var(--glow); }

  #speech.off { opacity: 0.35; }

  #mic.recording {
    background: rgba(255, 107, 107, 0.15);
    border-color: #ff6b6b;
    color: #ff6b6b;
    animation: rec-pulse 1.2s ease-in-out infinite;
  }

  @keyframes rec-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.4); }
    50%      { box-shadow: 0 0 0 10px rgba(255, 107, 107, 0); }
  }

  .permission {
    position: fixed;
    inset: 0;
    background: rgba(10, 20, 32, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(3px);
    z-index: 10;
  }

  .permission.visible { display: flex; }

  .permission-box {
    border: 1px solid var(--glow);
    border-radius: 8px;
    background: rgba(18, 33, 47, 0.95);
    padding: 28px 32px;
    text-align: center;
    max-width: 480px;
    box-shadow: 0 0 40px rgba(53, 224, 240, 0.15);
  }

  .permission-title {
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--glow-dim);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .permission-tool {
    font-size: 18px;
    color: var(--glow);
    margin-bottom: 6px;
  }

  .permission-args {
    font-size: 11px;
    color: var(--glow-dim);
    margin-bottom: 22px;
    word-break: break-all;
  }

  .permission-buttons { display: flex; gap: 12px; justify-content: center; }

  .permission-buttons button {
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 2px;
    padding: 10px 26px;
    border-radius: 20px;
    cursor: pointer;
    background: transparent;
    transition: all 0.2s;
  }

  #allow { border: 1px solid var(--glow); color: var(--glow); }
  #allow:hover { background: rgba(53, 224, 240, 0.15); }

  #deny { border: 1px solid #ff6b6b; color: #ff6b6b; }
  #deny:hover { background: rgba(255, 107, 107, 0.15); }
</style>
</head>
<body>

  <div class="panel panel-conversation">
    <div class="panel-title">CONVERSATION</div>
    <div class="panel-body" id="messages">
      <div class="panel-empty">say something</div>
    </div>
  </div>

  <div class="reactor">

    <!-- Outer dashed ring -->
    <svg class="spin-slowest" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="94" fill="none"
              stroke="var(--glow-dim)" stroke-width="0.8"
              stroke-dasharray="2 6"/>
    </svg>

    <!-- Segmented ring: long arcs with gaps -->
    <svg class="spin-slow" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="84" fill="none"
              stroke="var(--glow)" stroke-width="1.5"
              stroke-dasharray="60 30" opacity="0.7"/>
    </svg>

    <!-- Tick marks -->
    <svg class="spin-medium" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="72" fill="none"
              stroke="var(--glow)" stroke-width="4"
              stroke-dasharray="1 5" opacity="0.55"/>
    </svg>

    <!-- Thin bright ring -->
    <svg class="spin-fast" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="60" fill="none"
              stroke="var(--glow)" stroke-width="1"
              stroke-dasharray="120 40"/>
    </svg>

    <!-- Inner dotted ring -->
    <svg class="spin-medium" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="50" fill="none"
              stroke="var(--glow-dim)" stroke-width="3"
              stroke-dasharray="1 4"/>
    </svg>

    <!-- Static core ring + soft filled disc -->
    <svg viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="40" fill="none"
              stroke="var(--glow)" stroke-width="1.5" opacity="0.9"/>
      <circle class="pulse" cx="100" cy="100" r="38"
              fill="var(--glow)" opacity="0.12"/>
    </svg>

    <div class="core">
      <div class="label">JARVIS</div>
      <div class="status" id="status">standby</div>
    </div>

  </div>

  <div class="panel panel-feed">
    <div class="panel-title">TOOL ACTIVITY</div>
    <div class="panel-body" id="events">
      <div class="panel-empty">no activity yet</div>
    </div>
  </div>

  <div class="input-bar">
    <input id="input" type="text" placeholder="Type a message and press Enter…" autocomplete="off">
    <button id="speech" title="Toggle spoken replies">🔊</button>
    <button id="mic" title="Click to start talking, click again to stop">●</button>
  </div>

  <div class="permission" id="permission">
    <div class="permission-box">
      <div class="permission-title">Permission required</div>
      <div class="permission-tool" id="permission-tool"></div>
      <div class="permission-args" id="permission-args"></div>
      <div class="permission-buttons">
        <button id="deny">DENY</button>
        <button id="allow">ALLOW</button>
      </div>
    </div>
  </div>

  <script>
    const input = document.getElementById("input");
    const mic = document.getElementById("mic");
    const speechBtn = document.getElementById("speech");
    const permissionEl = document.getElementById("permission");
    let recording = false;

    // Escape anything coming from the server before putting it in the
    // DOM — screen OCR and model output can contain angle brackets.
    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    async function send(text) {
      await fetch("/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });
    }

    input.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      const text = input.value.trim();
      if (!text) return;
      send(text);
      input.value = "";
    });

    mic.addEventListener("click", async () => {
      const action = recording ? "stop" : "start";
      recording = !recording;
      await fetch("/mic", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action })
      });
    });

    speechBtn.addEventListener("click", async () => {
      await fetch("/speech", { method: "POST" });
    });

    async function decide(decision) {
      permissionEl.classList.remove("visible");
      await fetch("/permission", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ decision })
      });
    }

    document.getElementById("allow").addEventListener("click", () => decide("allow"));
    document.getElementById("deny").addEventListener("click", () => decide("deny"));

    // Keyboard shortcuts, so you don't have to reach for the mouse
    document.addEventListener("keydown", (e) => {
      if (!permissionEl.classList.contains("visible")) return;
      if (e.key === "y" || e.key === "Enter") decide("allow");
      if (e.key === "n" || e.key === "Escape") decide("deny");
    });

    function renderPermission(pending) {
      if (!pending) {
        permissionEl.classList.remove("visible");
        return;
      }
      document.getElementById("permission-tool").textContent = pending.tool;
      document.getElementById("permission-args").textContent = pending.args;
      permissionEl.classList.add("visible");
    }

    function renderEvents(events) {
      const container = document.getElementById("events");
      if (!events || events.length === 0) {
        container.innerHTML = '<div class="panel-empty">no activity yet</div>';
        return;
      }
      container.innerHTML = events.map(e => `
        <div class="event ${e.outcome}">
          <span class="event-time">${escapeHtml(e.time)}</span>
          <span class="event-tool">${escapeHtml(e.tool)}</span>
          <span class="event-args">${escapeHtml(e.args)}</span>
        </div>
      `).join("");
    }

    let lastRenderKey = "";

    function renderMessages(messages, streaming) {
      const container = document.getElementById("messages");

      if ((!messages || messages.length === 0) && !streaming) {
        container.innerHTML = '<div class="panel-empty">say something</div>';
        return;
      }

      let html = (messages || []).map(m => `
        <div class="turn ${m.role}">
          <div class="turn-role">${escapeHtml(m.role)}</div>
          <div class="turn-text">${escapeHtml(m.text)}</div>
        </div>
      `).join("");

      // The reply currently being written, shown with a blinking cursor
      if (streaming) {
        html += `
          <div class="turn jarvis streaming">
            <div class="turn-role">jarvis</div>
            <div class="turn-text">${escapeHtml(streaming)}</div>
          </div>
        `;
      }

      container.innerHTML = html;

      // Scroll whenever the content actually changed, so streaming text
      // stays in view without yanking the user around otherwise.
      const key = `${(messages || []).length}:${streaming.length}`;
      if (key !== lastRenderKey) {
        container.scrollTop = container.scrollHeight;
        lastRenderKey = key;
      }
    }

    async function poll() {
      try {
        const res = await fetch("/status");
        const data = await res.json();

        document.getElementById("status").textContent =
          data.detail ? `${data.status} — ${data.detail}` : data.status;

        // Keep the buttons in sync with Python's actual state,
        // in case they drift (e.g. a recording ended on its own).
        recording = data.recording;
        mic.classList.toggle("recording", data.recording);
        speechBtn.classList.toggle("off", !data.speech);
        speechBtn.textContent = data.speech ? "🔊" : "🔇";

        renderPermission(data.pending);
        renderEvents(data.events);
        renderMessages(data.messages, data.streaming || "");
      } catch (e) {
        document.getElementById("status").textContent = "disconnected";
      }
    }

    setInterval(poll, 60);
    poll();
    input.focus();
  </script>

</body>
</html>
